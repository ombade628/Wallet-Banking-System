services:
  mysql:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: banking, MYSQL_USER: banking, MYSQL_PASSWORD: banking, MYSQL_ROOT_PASSWORD: root }
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 5s, timeout: 5s, retries: 20 }
  app:
    build: .
    environment: { SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/banking, SPRING_DATASOURCE_USERNAME: banking, SPRING_DATASOURCE_PASSWORD: banking }
    ports: ["8080:8080"]
    depends_on: { mysql: { condition: service_healthy } }
volumes: { mysql-data: {} }
