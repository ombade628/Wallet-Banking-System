<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">

	<head th:replace="~{layout :: head('Admin')}"></head>
	
	<body>
		<nav th:replace="~{layout :: nav}">
		</nav>
	
		<main class="container py-4">
			<h1 class="h2">Admin dashboard</h1>
			<div class="row g-3">
			 
				<div class="col-md-3">
					<div class="card p-3">Users
						<h2 th:text="${userCount}"></h2>
					</div>
				</div>
						
				<div class="col-md-3">
					<div class="card p-3">Accounts
						<h2 th:text="${accountCount}"></h2>
					</div>
				</div>
				
				<div class="col-md-3">
					<div class="card p-3">Transactions
						<h2 th:text="${transactionCount}"></h2>
					</div>
				</div>
				<div class="col-md-3">
					<div class="card p-3">Money
						<h2 th:text="${money}"></h2>
					</div>
				</div>
			</div>
			
			<a class="btn btn-primary mt-4" href="/admin/users">Manage users</a>
		</main>
		
		<script src="/js/app.js"></script>
	</body>
</html>
