<!doctype html>

<html>

<head>

<title>Register · JavaBank</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="/css/app.css">

</head>


<body class="auth-page">

	<main class="card shadow-sm auth-card p-4">

		<h1 class="h3 text-center">Open your JavaBank account</h1>

		<div id="error" class="alert alert-danger d-none"></div>

		<form id="registerForm">

			<label class="form-label">Full name</label><input

				class="form-control mb-3" name="fullName" required maxlength="255"><label


				class="form-label">Email</label><input class="form-control mb-3"

				name="email" type="email" required><label class="form-label">Password</label><input


				class="form-control mb-3" id="password" name="password"

				type="password" minlength="8" required><label

				class="form-label">Confirm password</label><input

				class="form-control mb-3" id="confirmPassword" type="password"
				required>

			<button class="btn btn-primary w-100">Create account</button>

		</form>

		<p class="text-center mt-3 mb-0">

			<a href="/login">Back to sign in</a>

		</p>

	</main>

	<script src="/js/app.js"></script>

	<script>bankForm('registerForm','/api/auth/register',()=>{if(document.getElementById('password').value!==document.getElementById('confirmPassword').value)throw Error('Passwords do not match')});</script>

</body>

</html>
