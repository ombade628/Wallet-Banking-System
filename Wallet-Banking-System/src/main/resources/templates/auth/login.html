
<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Sign in · JavaBank</title>

<link

	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

	rel="stylesheet">

<link rel="stylesheet" href="/css/app.css">

</head>

<body class="auth-page">

	<main class="card shadow-sm auth-card p-4">

		<h1 class="h3 text-center mb-1">JavaBank</h1>
		<p class="text-center text-muted mb-4">Sign in to your banking</p>

		<div id="error" class="alert alert-danger d-none"></div>

		<form id="loginForm">

			<label class="form-label">Email</label><input


				class="form-control mb-3" name="email" type="email" required

				autofocus><label class="form-label">Password</label><input

				class="form-control mb-3" name="password" type="password" required>

			<button class="btn btn-primary w-100">Sign in</button>

		</form>

		<p class="text-center mt-3 mb-0">


			New here? <a href="/register">Create an account</a>


		</p>

	</main>

	<script src="/js/app.js"></script>

	<script>

	bankForm('loginForm', '/api/auth/login');
	

	</script>

</body>

</html>
