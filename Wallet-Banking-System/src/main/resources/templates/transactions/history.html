<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Transactions')}"></head><body><nav th:replace="~{layout :: nav}"></nav><main class="container py-4"><h1 class="h2">Transaction history</h1><div class="card"><table class="table sortable mb-0"><thead><tr><th>When</th><th>From</th><th>To</th><th>Amount</th></tr></thead><tbody><tr th:each="t:${transactions}"><td th:text="${#temporals.format(t.createdAt,'dd MMM yyyy HH:mm')}"></td><td th:text="${t.fromAccountNumber}"></td><td th:text="${t.toAccountNumber}"></td><td th:text="|${t.currency} ${t.amount}|"></td></tr></tbody></table></div></main><script src="/js/app.js"></script></body></html>
