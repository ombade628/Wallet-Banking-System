<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Transfer money')}"></head><body><nav th:replace="~{layout :: nav}"></nav><main class="container py-4"><div class="card p-4 form-card"><h1 class="h3">Transfer money</h1><div id="error" class="alert alert-danger d-none"></div><form id="transferForm"><input name="requestId" id="requestId" type="hidden"><label class="form-label">From</label><select class="form-select mb-3" name="fromAccountId" required><option th:each="a:${accounts}" th:value="${a.id}" th:text="|${a.accountNumber} — ${a.currency} ${a.balance}|"></option></select><label class="form-label">Recipient account number</label><input class="form-control" id="recipientNumber" required><div id="recipient" class="form-text mb-3">Enter an account number to verify the recipient.</div><input name="toAccountId" id="toAccountId" type="hidden"><label class="form-label">Amount</label><input class="form-control mb-3" name="amount" type="number" min="0.01" step="0.01" required><button class="btn btn-primary">Send money</button></form></div></main><script src="/js/app.js"></script><script>setupTransfer();</script></body></html>
