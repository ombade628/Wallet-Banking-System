<!doctype html><html><head><title>Transfer complete · JavaBank</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-5"><div class="card text-center p-5"><h1 class="text-success">Transfer complete</h1><p id="confirmation">Your transfer was successfully processed.</p><a class="btn btn-primary" href="/transfers/new">Make another transfer</a><a class="btn btn-outline-secondary" href="/dashboard">Back to dashboard</a></div></main><script>let t=JSON.parse(sessionStorage.getItem('lastTransfer')||'null');if(t)document.getElementById('confirmation').textContent=`${t.currency} ${t.amount} transferred. Transaction ID: ${t.transactionId}`;</script></body></html>
