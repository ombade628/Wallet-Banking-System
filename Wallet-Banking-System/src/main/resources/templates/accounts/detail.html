<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Account')}"></head><body><nav th:replace="~{layout :: nav}"></nav><main class="container py-4"><a href="/accounts">← Accounts</a><div class="card p-4 mt-3"><h1 class="h3" th:text="${account.accountNumber}"></h1><p class="display-6" th:text="|${account.currency} ${account.balance}|"></p><span th:text="${account.type}"></span> · <span th:text="${account.status}"></span><a class="btn btn-primary float-end" th:href="@{/transfers/new(from=${account.id})}">Transfer from this account</a></div><h2 class="h4 mt-4">Transactions</h2><table class="table"><tr th:each="t:${transactions}"><td th:text="${t.fromAccountNumber}"></td><td>→</td><td th:text="${t.toAccountNumber}"></td><td th:text="|${t.currency} ${t.amount}|"></td></tr></table></main><script src="/js/app.js"></script></body></html>
