<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Accounts')}"></head><body><nav th:replace="~{layout :: nav}"></nav><main class="container py-4"><div class="d-flex justify-content-between"><h1 class="h2">My accounts</h1><a class="btn btn-primary" href="/accounts/new">Create New Account</a></div><div class="card mt-3"><table class="table mb-0"><thead><tr><th>Account</th><th>Type</th><th>Balance</th><th>Status</th></tr></thead><tbody><tr th:each="a:${accounts}"><td><a th:href="@{/accounts/{id}(id=${a.id})}" th:text="${a.accountNumber}"></a></td><td th:text="${a.type}"></td><td th:text="|${a.currency} ${a.balance}|"></td><td th:text="${a.status}"></td></tr></tbody></table></div></main><script src="/js/app.js"></script></body></html>
