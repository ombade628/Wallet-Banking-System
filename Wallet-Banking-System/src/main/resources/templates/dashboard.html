<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Dashboard')}"></head><body><nav th:replace="~{layout :: nav}"></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2">Welcome, <span th:text="${user.fullName}">Customer</span></h1><p class="text-muted mb-0">Your accounts at a glance</p></div><a href="/accounts/new" class="btn btn-primary">New Account</a></div><div class="row g-3 mb-4"><div class="col-md-4" th:each="a : ${accounts}"><a class="text-decoration-none" th:href="@{/accounts/{id}(id=${a.id})}"><div class="card account-card p-3"><small th:text="${a.type}">SAVINGS</small><h3 th:text="|${a.currency} ${a.balance}|">INR 0.00</h3><span th:text="${a.accountNumber}"></span><span class="badge text-bg-success mt-2" th:text="${a.status}"></span></div></a></div><div class="col-12" th:if="${#lists.isEmpty(accounts)}"><div class="alert alert-info">Create your first account to get started.</div></div></div><div class="card"><div class="card-body"><h2 class="h5">Recent transactions</h2><table class="table mb-0"><thead><tr><th>When</th><th>From</th><th>To</th><th>Amount</th></tr></thead><tbody><tr th:each="t : ${transactions}"><td th:text="${#temporals.format(t.createdAt, 'dd MMM HH:mm')}"></td><td th:text="${t.fromAccountNumber}"></td><td th:text="${t.toAccountNumber}"></td><td th:text="|${t.currency} ${t.amount}|"></td></tr><tr th:if="${#lists.isEmpty(transactions)}"><td colspan="4" class="text-muted">No transactions yet.</td></tr></tbody></table></div></div></main><script src="/js/app.js"></script></body></html>
